<!-- ============================================================
     CENTRAL PORTAL & SSO — PROFILE & SIGNATURE VIEW (views/profile.html)
     ============================================================ -->
<div id="profileViewContainer">
  <div class="grid lg:grid-cols-3 gap-6 items-start">
    <!-- Left Column: Avatar & Digital Signature -->
    <div class="space-y-6">
      <!-- Profile Card -->
      <div class="card p-6 text-center">
        <img id="pfAvatarPreview" src="https://pr-bangkok.com/wp-content/uploads/2025/06/231116_BMA-Emblem_Edited_Green-600x600.png" alt="Profile" class="w-28 h-28 rounded-full object-cover mx-auto mb-3 border-4 border-[#007B3E] bg-white shadow-md">
        <h3 id="pfFullNameTx" class="font-bold text-lg">-</h3>
        <p class="text-xs font-mono font-semibold text-slate-600 dark:text-slate-300 mt-1">
          <i data-lucide="credit-card" class="w-3.5 h-3.5 inline mr-1 opacity-70"></i><span id="pfIdCardTx">-</span>
        </p>
        <p id="pfPositionTx" class="text-xs muted mt-0.5">-</p>
        <span id="pfRoleBadge" class="badge chip mt-2">USER</span>
        <input type="file" id="pfPhotoFileInput" accept="image/*" class="hidden" onchange="PORTAL_APP.handleUploadProfilePhoto(event)">
        <div class="mt-4">
          <button type="button" class="btn-ghost !py-1.5 !text-xs w-full justify-center" onclick="document.getElementById('pfPhotoFileInput').click()">
            <i data-lucide="camera" class="w-3.5 h-3.5"></i> เปลี่ยนรูปโปรไฟล์
          </button>
        </div>
      </div>

      <!-- Signature Pad Card -->
      <div class="card p-6">
        <h4 class="font-bold text-sm mb-2 flex items-center gap-2">
          <i data-lucide="feather" class="w-4 h-4 accent"></i> ลายเซ็นอิเล็กทรอนิกส์
        </h4>
        <div id="pfCurrentSigBox" class="mb-3 p-3 rounded-xl soft text-center min-h-[85px] flex items-center justify-center">
          <span class="text-xs muted">ยังไม่มีลายเซ็นในระบบ</span>
        </div>
        <canvas id="pfSigCanvas" class="sig-pad-canvas" width="460" height="150"></canvas>
        <div class="flex gap-2 mt-3">
          <button type="button" class="btn-ghost !py-1 !text-xs" onclick="PORTAL_APP.clearSignaturePad()">
            <i data-lucide="eraser" class="w-3 h-3"></i> ล้าง
          </button>
          <button type="button" class="btn-primary !py-1 !text-xs flex-1 justify-center" onclick="PORTAL_APP.saveCanvasSignature()">
            <i data-lucide="save" class="w-3 h-3"></i> บันทึกลายเซ็น
          </button>
          <input type="file" id="pfSigFileInput" accept="image/*" class="hidden" onchange="PORTAL_APP.handleUploadSignatureFile(event)">
          <button type="button" class="btn-ghost !py-1 !text-xs" onclick="document.getElementById('pfSigFileInput').click()">
            <i data-lucide="upload" class="w-3 h-3"></i> ไฟล์
          </button>
        </div>
      </div>
    </div>

    <!-- Right Column: Personal Info Edit Form -->
    <div class="lg:col-span-2">
      <div class="card p-6">
        <h4 class="font-bold text-base mb-4 flex items-center gap-2">
          <i data-lucide="user-pen" class="w-4 h-4 accent"></i> แก้ไขข้อมูลส่วนบุคคล
        </h4>
        <form onsubmit="PORTAL_APP.submitProfileUpdate(event)" class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div id="pfUsernameContainer"></div>
            <div>
              <label class="lbl">อีเมล (Email) *</label>
              <input id="pf_email" type="email" class="inp" required>
            </div>
          </div>
          <div class="grid grid-cols-3 gap-3">
            <div><label class="lbl">คำนำหน้า *</label><select id="pf_prefix" class="inp" required></select></div>
            <div><label class="lbl">ชื่อจริง *</label><input id="pf_first_name" class="inp" required></div>
            <div><label class="lbl">นามสกุล *</label><input id="pf_last_name" class="inp" required></div>
          </div>
          <div class="grid grid-cols-3 gap-3">
            <div><label class="lbl">ประเภทตำแหน่ง</label><select id="pf_position_type" class="inp"></select></div>
            <div><label class="lbl">สายงาน/ตำแหน่ง</label><select id="pf_position" class="inp"></select></div>
            <div><label class="lbl">ระดับตำแหน่ง</label><select id="pf_position_level" class="inp"></select></div>
          </div>
          <div class="grid grid-cols-3 gap-3">
            <div><label class="lbl">สำนัก</label><select id="pf_bureau_name" class="inp"></select></div>
            <div><label class="lbl">สำนักงาน/กอง</label><select id="pf_office" class="inp"></select></div>
            <div><label class="lbl">ฝ่าย/ส่วน</label><select id="pf_department" class="inp"></select></div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="lbl">กลุ่มงาน</label><select id="pf_division" class="inp"></select></div>
            <div><label class="lbl">ตำแหน่งอื่น/รักษาการ (ถ้ามี)</label><input id="pf_position_2" class="inp"></div>
          </div>
          <div class="p-4 rounded-xl soft space-y-3">
            <h5 class="font-bold text-xs muted uppercase tracking-wider">เปลี่ยนรหัสผ่าน (เว้นว่างไว้หากไม่ต้องการเปลี่ยน)</h5>
            <div class="grid grid-cols-2 gap-3">
              <div><label class="lbl">รหัสผ่านปัจจุบัน</label><input id="pf_current_pw" type="password" class="inp" placeholder="กรอกรหัสผ่านปัจจุบัน"></div>
              <div><label class="lbl">รหัสผ่านใหม่ (8 ตัวขึ้นไป)</label><input id="pf_new_pw" type="password" minlength="8" class="inp" placeholder="กรอกรหัสผ่านใหม่"></div>
            </div>
          </div>
          <div class="flex justify-end pt-2">
            <button type="submit" class="btn-primary !px-6">
              <i data-lucide="save" class="w-4 h-4"></i> บันทึกข้อมูลโปรไฟล์
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
